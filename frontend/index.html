<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>🏡 House Price Predictor</h2>
    
    <div class="input-group">
        <label for="income">Income (Rs):</label>
        <input type="number" id="income" placeholder="Minimum Rs.10,000" min="10000" required>
        <small class="hint">Please enter an income of Rs.10,000 or more.</small>
    </div>
    <div class="input-group">
        <label for="house_age">Average House Age (Years):</label>
        <input type="number" id="house_age" placeholder="e.g., 5" step="0.1" min="0" required>
    </div>

    <div class="input-group">
        <label for="rooms">Average Number of Rooms:</label>
        <input type="number" id="rooms" placeholder="e.g., 6" min="1" required>
    </div>

    <button id="predictBtn">Estimate Price</button>

    <div id="result" class="result-box"></div>
</div>
<script src="script.js"></script>
</body>
</html>
