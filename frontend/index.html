<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="header">
        <h2><i class="fa-solid fa-house-chimney-user"></i> House Price Predictor</h2>
        <p class="subtitle">Enter property and neighborhood details to estimate the price.</p>
    </header>

    <form id="predictorForm" onsubmit="return false;">
        <div class="input-group">
            <label for="income"><i class="fa-solid fa-indian-rupee-sign"></i> Area Average Income:</label>
            <input type="number" id="income" placeholder="e.g., 50000" min="10000" required>
            <small class="hint">Minimum Rs. 10,000 required.</small>
        </div>

        <div class="input-group">
            <label for="house_age"><i class="fa-solid fa-calendar-days"></i> Average House Age (Years):</label>
            <input type="number" id="house_age" placeholder="e.g., 5" step="0.1" min="0" required>
        </div>

        <div class="input-group">
            <label for="rooms"><i class="fa-solid fa-door-open"></i> Average Number of Rooms:</label>
            <input type="number" id="rooms" placeholder="e.g., 6" step="0.1" min="1" required>
        </div>

        <button type="button" id="predictBtn">
            <i class="fa-solid fa-calculator"></i> Estimate Price
        </button>
    </form>

    <div id="result" class="result-box" style="display: none;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
