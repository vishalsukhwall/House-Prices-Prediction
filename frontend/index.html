<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor | AI Estimator</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Dark Red/Black Gradient Background */
            background: linear-gradient(135deg, #1a0f0f, #291e1e, #413333);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            /* Glassmorphism effect with slight red tint */
            background: rgba(41, 30, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h2 i {
            /* Red accent for icon */
            color: #ef4444; 
        }

        .subtitle {
            font-size: 14px;
            color: #d1d5db;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label i {
            /* Red accent for input icons */
            color: #ef4444;
        }

        .input-group input {
            background: rgba(23, 15, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            /* Red glowing focus border */
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
            background: rgba(23, 15, 15, 0.9);
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }

        #predictBtn {
            width: 100%;
            /* Red Gradient Button */
            background: linear-gradient(135deg, #b91c1c, #dc2626);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #predictBtn:hover {
            /* Darker Red on hover */
            background: linear-gradient(135deg, #991b1b, #b91c1c);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
            transform: translateY(-2px);
        }

        #predictBtn:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 25px;
            padding: 18px;
            /* Greenish background for success, kept it for contrast */
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #34d399;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h2><i class="fa-solid fa-house-chimney-user"></i> House Price Predictor</h2>
        <p class="subtitle">Enter property and neighborhood details to estimate the price.</p>
    </header>

    <form id="predictorForm" onsubmit="return false;">
        <div class="input-group">
            <label for="income"><i class="fa-solid fa-indian-rupee-sign"></i> Area Average Income:</label>
            <input type="number" id="income" placeholder="e.g., 50000" min="10000" required>
            <small class="hint">Minimum Rs. 10,000 required.</small>
        </div>

        <div class="input-group">
            <label for="house_age"><i class="fa-solid fa-calendar-days"></i> Average House Age (Years):</label>
            <input type="number" id="house_age" placeholder="e.g., 5" step="0.1" min="0" required>
        </div>

        <div class="input-group">
            <label for="rooms"><i class="fa-solid fa-door-open"></i> Average Number of Rooms:</label>
            <input type="number" id="rooms" placeholder="e.g., 6" step="0.1" min="0" required>
        </div>

        <button type="button" id="predictBtn">
            <i class="fa-solid fa-calculator"></i> Estimate Price
        </button>
    </form>

    <div id="result" class="result-box"></div>
</div>

<script>
    document.getElementById('predictBtn').addEventListener('click', function() {
        const income = document.getElementById('income').value;
        const houseAge = document.getElementById('house_age').value;
        const rooms = document.getElementById('rooms').value;
        const resultBox = document.getElementById('result');

        if(!income || !houseAge || !rooms || income < 10000) {
            alert('Please fill out all fields correctly. Income must be at least Rs. 10,000.');
            return;
        }

        // Interactive loading state
        resultBox.style.display = 'block';
        resultBox.style.borderColor = 'rgba(16, 185, 129, 0.3)'; // Reset to green tint
        resultBox.style.color = '#34d399';
        resultBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Calculating estimated price...`;

        // Simulate API call with setTimeout

        setTimeout(() => {
            // Dummy calculation logic (replace with your actual ML model prediction)
            // Price = (Income * 5) + (Avg Area House Age * 30000) + (Avg Number of Rooms * 100000)
            const estimatedPrice = (income * 5) + (houseAge * 30000) + (rooms * 100000);
            
            const formattedPrice = estimatedPrice.toLocaleString('en-IN', {
                maximumFractionDigits: 0
            });
            
            resultBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> Estimated Price: ₹ ${formattedPrice}`;
        }, 1500); // 1.5 seconds delay for effect
    });
</script>

</body>
</html>
